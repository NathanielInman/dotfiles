# Never autosuspend Bluetooth USB adapters (the TP-Link UB500 / RTL8761B).
# btusb enables autosuspend itself when it binds, after udev rules have run,
# so a power/control=on udev rule does not stick. With autosuspend on, the
# UB500's firmware download at boot timed out (command 0xfc20 tx timeout,
# endless "Resetting usb device") on 3 of 8 boots in 2026-11, leaving no
# controller and no mouse. Autosuspend also dropped the MX Master mid-use.
options btusb enable_autosuspend=0
