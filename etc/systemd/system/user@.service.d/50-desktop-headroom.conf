# Keep the desktop usable when agents, builds and batch jobs saturate the box.
#
# Hyprland and kitty run in the login session scope (session-N.scope), outside
# user@.service. Everything else (Chrome, Slack, T3 Code, its agents, lowprio
# jobs) runs under user@.service, so pinning user@.service off CPU core 0
# (logical CPUs 0 and 8 on the 3700X) leaves that core to the compositor, the
# terminal and system services no matter how much load agents generate.
#
# systemd-oomd kills the worst offending cgroup under user@.service once memory
# pressure stays above 50% for 30s, before the machine thrashes into a hang.
[Service]
AllowedCPUs=1-7,9-15
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
