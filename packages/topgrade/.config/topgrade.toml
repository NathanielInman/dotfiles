# topgrade — one command to upgrade everything (pacman + AUR, rustup/cargo,
# pnpm, oh-my-zsh, vim/nvim plugins, etc.). topgrade auto-detects each tool,
# so this file is intentionally minimal: it only pins the choices this repo
# already makes elsewhere. Run with `topgrade`; see `topgrade --help`.

[misc]
# Tidy caches after upgrading (paccache, cargo, etc.) — matches the
# paccache.timer cleanup set up in docs/setting-up-archlinux.md.
cleanup = true
# gcloud is installed via pacman (google-cloud-cli), so its own
# `gcloud components update` refuses ("managed by an external package
# manager") — pacman already upgrades it in the System step. Skip it.
disable = ["gcloud"]

[linux]
# Use paru for both repo and AUR upgrades (yay is aliased to paru here).
arch_package_manager = "paru"

[containers]
# topgrade re-pulls every local image. Skip the ones that can never pull:
# images built locally (no registry behind them) and work CI images on the
# private GitLab registry, which need a short-lived token and are pulled by
# the jobs that use them anyway.
ignored_containers = [
  "webview-local:*",
  "registry.gitlab.com/digitalturbine/*",
]

[commands]
# Blender MCP lives in its own venv instead of running under `uvx`: every
# Claude Code session's uvx wrapper holds a shared lock on ~/.cache/uv for
# its whole lifetime, so cleanup's `uv cache prune` hung forever waiting
# for them ("cache is currently in-use"). --allow-existing keeps the venv
# and rebuilds against the new interpreter after a pacman python bump.
"Blender MCP" = "uv venv -q --allow-existing --python /usr/bin/python3 ~/.local/share/blender-mcp && uv pip install -q --upgrade --python ~/.local/share/blender-mcp 'git+https://projects.blender.org/lab/blender_mcp.git#subdirectory=mcp'"

[post_commands]
# Long-running GTK daemons keep old (now-deleted) .so mappings after an
# in-place glibc/gtk upgrade and eventually segfault; bounce waybar so it
# reloads against the fresh libraries. Restart is instant and stateless.
"Restart waybar" = "systemctl --user restart waybar"
