# Razer Leviathan soundbar: disable Bluetooth (AVRCP) hardware volume.
# The bar quantizes volume to coarse steps and reports the rounded-down
# value back, so every volume bump snaps a couple of percent lower.
# With hw volume off, PipeWire scales volume in software instead.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "bluez_card.7C_96_D2_1D_71_D0" } ]
    actions = { update-props = { bluez5.hw-volume = [ ] } }
  }
]
