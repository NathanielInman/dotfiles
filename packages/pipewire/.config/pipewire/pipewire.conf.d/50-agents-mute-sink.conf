# Silent sink for background Claude agents. ~/.claude/settings.json sets
# PULSE_SINK/PIPEWIRE_NODE=agents_mute, so games, test windows and other
# audio that agents start play into this null sink instead of the speakers.
# Pick "Agents (muted)" in pavucontrol to move a stream back if you want it.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = agents_mute
      node.description = "Agents (muted)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      priority.session = 0
      priority.driver  = 0
    }
  }
]
