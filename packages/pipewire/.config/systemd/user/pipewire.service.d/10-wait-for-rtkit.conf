# rtkit is D-Bus activated, so at login PipeWire can ask for realtime
# scheduling before rtkit is up. The request fails silently and the audio
# threads stay at nice 0 / SCHED_OTHER until the next restart, so any heavy
# CPU load makes playback stutter. Touching rtkit first activates it and
# blocks until it answers. wireplumber and pipewire-pulse are ordered after
# pipewire.service, so this covers them too. The leading '-' keeps audio
# starting even if rtkit is missing.
[Service]
ExecStartPre=-/usr/bin/busctl --system --timeout=5 get-property org.freedesktop.RealtimeKit1 /org/freedesktop/RealtimeKit1 org.freedesktop.RealtimeKit1 MaxRealtimePriority
