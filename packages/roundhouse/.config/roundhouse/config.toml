# Roundhouse: the system drawer behind the lamp in waybar.
# https://github.com/NathanielInman/roundhouse
#
# Everything here is optional; the font and colors come from waybar's style.css.

[network]
# The old details drawer showed the public IP; keep it in the Network tile.
# Asks ifconfig.co at most once a minute, only while the drawer is open.
public_ip = true

[storage]
# btrfs plumbing on the Sabrent, not places I keep things.
hide = ["/swap", "/.snapshots", "/var/log", "/var/cache/pacman/pkg"]
