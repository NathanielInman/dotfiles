# Screen off after 30 minutes of idle, with the same guard as the power
# menu's Idle so the G9 relinking in standby can't light itself back up.
# dpms dispatch: legacy keyword form first, then the lua-config (Hyprland
# 0.55+) form. Backticks instead of $() because hyprlang eats $ sequences.
listener {
    timeout = 1800
    on-timeout = ([ "`hyprctl dispatch dpms off`" = "ok" ] || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'); setsid -f ~/.config/waybar/scripts/idle-dpms-guard.py >/dev/null 2>&1
    on-resume = [ "`hyprctl dispatch dpms on DP-1`" = "ok" ] || hyprctl dispatch 'hl.dsp.dpms({ action = "on", monitor = "DP-1" })'; [ "`hyprctl dispatch dpms on DP-2`" = "ok" ] || hyprctl dispatch 'hl.dsp.dpms({ action = "on", monitor = "DP-2" })'
}
