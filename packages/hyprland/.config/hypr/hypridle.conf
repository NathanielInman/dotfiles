# Screen off after 30 minutes of idle; any key press or mouse move wakes it
# (key_press_enables_dpms / mouse_move_enables_dpms in options.lua, with
# on-resume as a backstop). The config is lua (Hyprland 0.55+), so dispatches
# use the hl.dsp form; the old keyword form only returns a parse error.
# Inhibitors are ignored so T3 Code's can't hold the screens on; the
# condition re-checks every other inhibitor and audio (see the script).
listener {
    timeout = 1800
    ignore_inhibit = true
    condition_cmd = ~/.config/hypr/scripts/idle-screen-off-ok.sh
    condition_retry = 60
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
