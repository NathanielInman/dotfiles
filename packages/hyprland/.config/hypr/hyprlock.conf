# ╔══════════════════════════════════════════════════════════════╗
# ║  Hyprlock Configuration                                    ║
# ╚══════════════════════════════════════════════════════════════╝

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
}

# The password box is the picker's search box (packages/walker): a
# translucent panel, thin slate border, 12px corners. Its outline turns
# frost while checking, red on a wrong password and amber with caps lock,
# the bar's colors for working, needs you and heads-up.
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(4C566A8C)
    inner_color = rgba(282A2EE6)
    font_color = rgb(D8DEE9)
    font_family = PragmataPro Liga
    fade_on_empty = true
    placeholder_text = <span foreground="##616E88">Password</span>
    hide_input = false
    rounding = 12
    check_color = rgb(88C0D0)
    fail_color = rgb(BF616A)
    fail_text = <span foreground="##BF616A">$FAIL</span>
    capslock_color = rgb(EBCB8B)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(D8DEE9)
    font_size = 64
    font_family = PragmataPro Liga
    position = 0, 80
    halign = center
    valign = center
}
