# paru reads only the first config it finds, and this one comes before
# /etc/paru.conf, so pull the stock settings in and add to them.
[options]
Include = /etc/paru.conf

# Remove an AUR package's build-only dependencies (meson, scons, gtk-doc...)
# once it is installed. paru's default asks, and an unattended install
# (--noconfirm, the rebuild) answers no, which left 25 orphans after the
# 2026-11 reinstall.
RemoveMake
