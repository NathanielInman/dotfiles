# Switchyard: the board behind the waybar signal (custom/switchyard).
# https://github.com/NathanielInman/switchyard (reference: docs/design.md)
#
# Tasks live in tasks.d/ here rather than in each repo, so repos I do not
# own (LaunchPad) stay clean and everything is in one place.

scan = []
path_prepend = ["~/.config/switchyard/bin", "~/.local/bin", "~/.cargo/bin"]
ok_flash = 6

terminal = ["kitty", "--class", "float-term", "--hold", "-e"]
editor = ["kitty", "--class", "float-term", "-e", "nvim", "+{line}", "{file}"]

# CLAUDE.md "Heavy builds on this workstation": one heavy build at a time,
# only with ~16 GB free, capped at 16G with idle CPU weight and nice 19.
[mainline]
min_free = "16G"
mem = "16G"
idle_cpu = true
nice = 19

[board]
width = 660
font = "PragmataPro Liga"

[[tab]]
name = "Games"
tags = ["games"]

[[tab]]
name = "Deploys"
tags = ["deploy"]

[[tab]]
name = "Desk"
tags = ["desk"]

[bar]
icon = "󰐱"

[shelf]
stale_days = 30
tools = "none"
binds = true

# The old "app names" list (waybar/scripts/commands.sh).
[[shelf.tool]]
name = "scc"
desc = "count lines of code in a repo per language"
[[shelf.tool]]
