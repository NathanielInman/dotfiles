; vit config. Its presence also skips vit's first-run "create config?" prompt,
; which would otherwise block the workspace 6 autostart. vit finds the taskrc
; through ~/.config/task/taskrc on its own. All options with defaults:
; /usr/lib/python3.*/site-packages/vit/config/config.sample.ini

[vit]
default_report = next

[keybinding]
; o opens the task's long-form note (created on first save).
o = :!r nvim ~/Sites/tasks/notes/{TASK_UUID}.md<Enter>
